spring.application.name=FashionVista_Backend

# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration for Tests
jwt.signerKey=test-jwt-secret-key-for-testing-must-be-at-least-256-bits-long
jwt.valid-duration=90000
jwt.refreshable-duration=14

# Cloudinary Mock Configuration
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

# Email Mock Configuration
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
app.mail.from-email=
app.mail.from-name=Sixthsoul

# Application Configuration
app.name=Sixthsoul
app.frontend.url=http://localhost:5173

# VNPay Mock Configuration
vnpay.tmn-code=test-tmn
vnpay.hash-secret=test-hash-secret
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:5173/payment/result
vnpay.ipn-url=http://localhost:8085/api/payment/vnpay-ipn

# Login Activity Configuration
login-activity.enabled=false
login-activity.retention-days=90
