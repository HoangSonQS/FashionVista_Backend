# Disable DataSource auto-configuration for tests if we don't need a real DB
spring.datasource.url=jdbc:postgresql://localhost:5432/sixthsoul_test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${TEST_PASSWORD_DB}
spring.jpa.hibernate.ddl-auto=create-drop

jwt.signerKey=day-la-mot-chuoi-bi-mat-rat-dai-de-test-jwt-signer-key-123456
jwt.valid-duration=90000
jwt.refreshable-duration=14

vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.ipn-url=${VNPAY_IPN_URL}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Email Configuration
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
app.mail.from-email=
app.mail.from-name=Sixthsoul

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.name=Sixthsoul
app.frontend.url=${FRONTEND_URL}

# Login Activity Configuration
login-activity.enabled=true
login-activity.retention-days=90
