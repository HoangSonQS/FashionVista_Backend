spring.application.name=FashionVista_Backend

# Server Configuration

server.port=${PORT:8085}


# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration
logging.level.root=WARN
logging.level.com.fashionvista.backend=WARN

# Upload File Configuration (Cho upload ?nh s?n ph?m)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.signerKey=${JWT_SECRET_KEY}
jwt.valid-duration=${JWT_ACCESS_TTL_SECONDS:600}
jwt.refreshable-duration=30

app.security.jwt.issuer=${JWT_ISSUER:sixthsoul}
app.security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:600}
app.security.refresh-token.ttl-seconds=${REFRESH_TOKEN_TTL_SECONDS:2592000}
app.security.refresh-token.cookie-name=refresh_token
app.security.refresh-token.cookie-path=/api/v1/auth
app.security.refresh-token.same-site=Lax
app.security.refresh-token.secure=${REFRESH_COOKIE_SECURE:true}
app.security.refresh-token.http-only=true
app.security.redis.key-prefix=sixthsoul:

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:false}
app.mail.from-email=${MAIL_FROM_EMAIL:${SPRING_MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:Sixthsoul}


# Application Configuration
app.name=Sixthsoul
app.frontend.url=${FRONTEND_URL}

# VNPay Configuration
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.ipn-url=${VNPAY_IPN_URL}

# Login Activity Configuration
login-activity.enabled=false

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
login-activity.enabled=false
login-activity.retention-days=90

# Sapo Integration
sapo.api.key=${SAPO_API_KEY:dev-sapo-key-change-me}

# Sapo Outbound Integration (Website -> Sapo, and inventory webhook Sapo -> Website)
sapo.outbound.api-key=${SAPO_OUTBOUND_API_KEY:dev-key-change-me}
sapo.outbound.api-secret=${SAPO_OUTBOUND_API_SECRET:dev-secret-change-me}
sapo.outbound.store-domain=${SAPO_STORE_DOMAIN:your-store.mysapo.net}
sapo.outbound.webhook-secret=${SAPO_WEBHOOK_SECRET:dev-webhook-secret-change-me}

# Sync Health Configuration
admin.alert.email=${ADMIN_ALERT_EMAIL:}
app.admin.url=${ADMIN_URL:http://localhost:5174}
