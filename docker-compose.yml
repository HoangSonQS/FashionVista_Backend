services:
  db:
    image: postgres:15-alpine
    container_name: fashionvista-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sixthsouldb}
      POSTGRES_USER: ${POSTGRES_USER:-sixthsoul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sixthsoul62025}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sixthsoul} -d $${POSTGRES_DB:-sixthsouldb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    container_name: fashionvista-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c 'redis-server --appendonly yes
      $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  backend:
    # Sử dụng image đã được CI/CD build và push lên Docker Hub
    image: ${DOCKER_USERNAME:-hoangfsonw}/fashionvista-backend:latest
    container_name: fashionvista-backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-sixthsouldb}
      - DB_USERNAME=${POSTGRES_USER:-sixthsoul}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-sixthsoul62025}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - backend-network

  nginx:
    image: nginx:alpine
    container_name: fashionvista-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
