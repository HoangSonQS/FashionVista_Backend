name: Spring Boot CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fashionvista-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/fashionvista-backend:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Navigate to the backend directory where docker-compose.yml lives
            cd /home/deploy/fashionvista/backend
            
            # Pull the latest backend image (pushed in previous job)
            docker-compose pull backend
            
            # Restart the stack
            # This will update the backend container and ensure dependencies (db, nginx) are running
            docker-compose up -d
            
            # Cleanup old images
            docker image prune -f

            # Health Check through Nginx (port 80/443) or direct backend (8085)
            echo "Waiting for stack to stabilize..."
            sleep 30
            
            # Check backend health directly via Docker network or localhost mapping
            if docker exec fashionvista-backend curl -f http://localhost:8085/actuator/health; then
              echo "Deployment successful!"
            else
              echo "Health check failed! Check logs with: docker-compose logs backend"
              exit 1
            fi
