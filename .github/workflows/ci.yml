name: Spring Boot CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fashionvista-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/fashionvista-backend:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Copy Docker and Nginx configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # Sync docker-compose.yml and the whole nginx directory
          source: "docker-compose.yml,nginx/"
          target: "/home/deploy/fashionvista/backend"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /home/deploy/fashionvista/backend
            
            # Pull new backend image
            docker-compose pull backend
            
            # Update the entire stack
            docker-compose up -d
            
            # Cleanup
            docker image prune -f

            echo "Deployment finished. Checking backend health..."
            sleep 30
            # Note: The container name here should match 'container_name' in docker-compose.yml
            # In our production docker-compose.yml it is 'fashionvista-backend'
            if docker exec fashionvista-backend curl -f http://localhost:8085/actuator/health; then
              echo "✅ Health check passed!"
            else
              echo "❌ Health check failed!"
              docker-compose logs backend | tail -n 50
              exit 1
            fi
