name: Spring Boot CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fashionvista-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/fashionvista-backend:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Stop and remove existing container
            docker stop fashionvista-backend || true
            docker rm fashionvista-backend || true
            
            # Pull new image
            docker pull ${{ secrets.DOCKER_USERNAME }}/fashionvista-backend:sha-${{ github.sha }}
            
            # Run new container
            # Using --env-file for security and --restart for resilience
            # Binding to 127.0.0.1:8085 to prevent external access (Nginx proxy only)
            docker run -d \
              --name fashionvista-backend \
              --restart unless-stopped \
              --pull always \
              -p 127.0.0.1:8085:8085 \
              --add-host=host.docker.internal:host-gateway \
              -v /home/deploy/fashionvista/uploads:/app/uploads \
              --env-file /home/deploy/fashionvista/backend/.env \
              ${{ secrets.DOCKER_USERNAME }}/fashionvista-backend:sha-${{ github.sha }}
              
            # Optional: Remove old images to save space
            docker image prune -f

            # Health Check
            echo "Waiting for service to start..."
            sleep 30
            if curl -f http://localhost:8085/actuator/health; then
              echo "Deployment successful!"
              echo "--------------------------------------------------------"
              echo "ROLLBACK COMMAND (Save this for emergency):"
              echo "docker stop fashionvista-backend && docker rm fashionvista-backend"
              echo "docker run -d --name fashionvista-backend --restart unless-stopped -p 127.0.0.1:8085:8085 -v /home/ubuntu/fashionvista/uploads:/app/uploads --env-file /home/ubuntu/fashionvista/backend/.env ${{ secrets.DOCKER_USERNAME }}/fashionvista-backend:sha-${{ github.sha }}"
              echo "--------------------------------------------------------"
            else
              echo "Health check failed!"
              exit 1
            fi
