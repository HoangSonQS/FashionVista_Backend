name: Spring Boot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fashionvista
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Wait for Postgres
        run: sleep 10

      - name: Set up environment variables
        run: |
          echo "DB_URL=jdbc:postgresql://localhost:5432/fashionvista" >> $GITHUB_ENV
          echo "DB_USERNAME=postgres" >> $GITHUB_ENV
          echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=test-jwt-secret-key-for-ci-pipeline-must-be-at-least-256-bits-long" >> $GITHUB_ENV
          echo "CLOUDINARY_CLOUD_NAME=test-cloud" >> $GITHUB_ENV
          echo "CLOUDINARY_API_KEY=test-api-key" >> $GITHUB_ENV
          echo "CLOUDINARY_API_SECRET=test-api-secret" >> $GITHUB_ENV
          echo "BREVO_API_KEY=test-brevo-key" >> $GITHUB_ENV
          echo "SENDER_EMAIL=test@example.com" >> $GITHUB_ENV
          echo "BREVO_API_URL=https://api.brevo.com/v3/smtp/email" >> $GITHUB_ENV
          echo "FRONTEND_URL=http://localhost:5173" >> $GITHUB_ENV
          echo "VNPAY_TMN_CODE=test-tmn" >> $GITHUB_ENV
          echo "VNPAY_HASH_SECRET=test-hash-secret" >> $GITHUB_ENV
          echo "VNPAY_PAY_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html" >> $GITHUB_ENV
          echo "VNPAY_RETURN_URL=http://localhost:5173/payment/result" >> $GITHUB_ENV
          echo "VNPAY_IPN_URL=http://localhost:8085/api/payment/vnpay-ipn" >> $GITHUB_ENV

      - name: Build with Maven
        run: ./mvnw clean install -DskipTests

      - name: Run tests
        run: ./mvnw test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
